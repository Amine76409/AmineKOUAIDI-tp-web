      ne sauront plus où tu es. Mais tu peux aussi chercher une autre issue.
    </p>

    <div class="choix">
      <a class="bouton" href="scene07.html">
        <i class="fa-solid fa-power-off"></i> Couper l'alarme
      </a>
      <a class="bouton bouton-danger" href="scene08.html">

      </a>
    </div>
