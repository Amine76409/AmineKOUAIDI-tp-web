    <h1>Le badge caché</h1>
    <p>
      Sous le lit, tu trouves un badge d'accès oublié par un gardien.
      En le passant sur le lecteur, la porte s'ouvre sans bruit.
      Dehors, tu vois un ascenseur et, en haut du mur, une grille d'aération.
    </p>

    <div class="choix">
      <a class="bouton" href="scene05.html">

      </a>
