<!-- La classe choisit l'image de fond -->

  <main class="scene">
    <h1>Réveil dans la cellule</h1>

      Tu ouvres les yeux. Le sol est froid et une lumière blanche clignote au plafond.

      Dans un coin, une table et un lit étroit.
    </p>

    <!-- Les boutons pour choisir -->
    <div class="choix">
      <!-- Ce bouton va vers la scène 2 -->

      </a>
